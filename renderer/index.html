<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="topbar" class="drag">
      <div id="leftControls" class="noDrag">
        <button id="btnBack" class="iconBtn noDrag" title="Back">←</button>
        <button id="btnForward" class="iconBtn noDrag" title="Forward">→</button>
        <button id="btnReload" class="iconBtn noDrag" title="Reload">⟳</button>
        <button id="btnHome" class="iconBtn noDrag" title="Home">
          <img id="homeIcon" alt="Home" />
        </button>
      </div>

      <div id="tabStrip" class="noDrag">
        <div id="tabs" class="drag" aria-label="Tabs"></div>
        <button id="btnPlus" class="iconBtn noDrag" title="New tab">+</button>
      </div>

      <div id="topbarDragFill" class="drag" aria-hidden="true"></div>

      <div id="rightControls" class="noDrag">
        <button id="btnDownloads" class="iconBtn" title="Downloads">⭳</button>
        <div class="winBtns">
          <button id="btnMin" class="winBtn" title="Minimize">—</button>
          <button id="btnMax" class="winBtn" title="Maximize">□</button>
          <button id="btnClose" class="winBtn close" title="Close">✕</button>
        </div>
      </div>
    </div>

    <div id="resizeHandle" class="noDrag" title="Resize window" aria-label="Resize"></div>

    <div id="linkStatus" class="link-status" aria-live="polite"></div>

    <script src="./renderer.js"></script>
  </body>
</html>
