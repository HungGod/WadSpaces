# The WadSpaces kiosk compositor. sway rather than cage because the screen
# holds more than one window: Wad Creator (the shell: sign-in, your
# wadspaces, the switcher and the Wi-Fi/power menus) and one window per
# workspace (a lean workspace image drawing directly here). wadd switches
# between them over sway's IPC socket (wadd/display.py).
#
# Deliberately no key bindings: wadd grabs the keyboards and handles
# Super+Tab and friends itself, and nothing here should close a window.
# Ctrl+Alt+F1..F12 still switch VTs (handled by wlroots, not a binding).

default_border none
default_floating_border none
focus_follows_mouse no
focus_on_window_activation none
xwayland disable

# The shell (Wad Creator, app_id "wadcreator") lives on workspace "shell".
# Every other window (a workspace's desktop) starts out on the hidden
# "pending" workspace, so it never takes over the screen while it is
# starting; wadd moves it to "ws-<id>" and focuses it when you switch to it.
assign [app_id="^(?!wadcreator$)"] workspace pending
for_window [all] fullscreen enable
# GitHub's sign-in page (a window of Wad Creator's, src-tauri/src/window.rs)
# floats over the app instead, so the app's Cancel stays in reach.
for_window [app_id="^wadcreator$" title="^Sign in to GitHub$"] fullscreen disable, floating enable, resize set 900 720, move position center

workspace shell
exec /usr/libexec/wadspaces/wadcreator-session
# Wi-Fi / power / timer, floating above every window (wlr-layer-shell overlay).
exec /usr/libexec/wadspaces/hud
