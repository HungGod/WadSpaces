# The WadSpaces kiosk compositor. sway rather than cage because the screen
# holds more than one window: WadSpaces Client (the shell: sign-in, your
# wadspaces, the switcher and the Wi-Fi/power menus) and one window per
# workspace (a lean workspace image drawing directly here). wadd switches
# between them over sway's IPC socket (apps/wadd/src/display.rs).
#
# Hardly any key bindings: wadd grabs the keyboards and handles Super+Tab
# and friends itself, and nothing here should close a window. Ctrl+Alt+F1..F12
# still switch VTs (handled by wlroots, not a binding).
#
# The only ones: the brightness and volume keys (the keyboard's, and the
# screen's volume buttons, which wadd doesn't grab). `hud --key` hands each to
# the running HUD, which changes it and shows the level for a moment. They
# repeat while held.
bindsym --locked XF86MonBrightnessUp exec /usr/libexec/wadspaces/hud --key brightness-up
bindsym --locked XF86MonBrightnessDown exec /usr/libexec/wadspaces/hud --key brightness-down
bindsym --locked XF86AudioRaiseVolume exec /usr/libexec/wadspaces/hud --key volume-up
bindsym --locked XF86AudioLowerVolume exec /usr/libexec/wadspaces/hud --key volume-down
bindsym --locked XF86AudioMute exec /usr/libexec/wadspaces/hud --key volume-mute

default_border none
default_floating_border none
focus_follows_mouse no
focus_on_window_activation none
xwayland disable

# The shell (the WadSpaces Client, app_id "client") lives on workspace "shell".
# Every other window (a workspace's desktop) starts out on the hidden
# "pending" workspace, so it never takes over the screen while it is
# starting; wadd moves it to "ws-<id>" and focuses it when you switch to it.
assign [app_id="^(?!client$)"] workspace pending
for_window [all] fullscreen enable
# GitHub's sign-in page (a window of WadSpaces Client's, src-tauri/src/window.rs)
# floats over the app instead, so the app's Cancel stays in reach.
for_window [app_id="^client$" title="^Sign in to GitHub$"] fullscreen disable, floating enable, resize set 900 720, move position center

workspace shell
exec /usr/libexec/wadspaces/client-session
# Wi-Fi / power / timer, floating above every window (wlr-layer-shell overlay).
exec /usr/libexec/wadspaces/hud
