# The WadSpaces kiosk compositor. sway rather than cage because the screen
# holds more than one window: the kiosk browser (the shell: Home, streamed
# workspaces, Wad Creator) and one window per native workspace (a lean
# workspace image drawing directly here). wadd switches between them over
# sway's IPC socket (wadd/display.py).
#
# Deliberately no key bindings: wadd grabs the keyboards and handles
# Super+Tab and friends itself, and nothing here should close a window.
# Ctrl+Alt+F1..F12 still switch VTs (handled by wlroots, not a binding).

default_border none
default_floating_border none
focus_follows_mouse no
focus_on_window_activation none
xwayland disable

# The shell lives on workspace "shell". Every other window (a native
# workspace's desktop) starts out on the hidden "pending" workspace, so it
# never takes over the screen while it is starting; wadd moves it to
# "ws-<id>" and focuses it when you switch to it.
assign [app_id="(?i)^(?!chromium)"] workspace pending
for_window [all] fullscreen enable

workspace shell
exec /usr/libexec/wadspaces/chromium-kiosk
# Wi-Fi / power / timer, floating above every window (wlr-layer-shell overlay).
exec /usr/libexec/wadspaces/hud
