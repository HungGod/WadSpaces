# The kiosk user. No extra groups: logind gives the active seat session access
# to the GPU and input devices, and wadd (root) reads /dev/input for hotkeys.
# uid 1000 is fixed: native workspaces mount /run/user/1000 (the kiosk's sway
# socket), and their abc user runs as PUID 1000 so it owns that socket too.
u wad 1000 "WadSpaces kiosk" /var/home/wad /bin/bash

# Debug/SSH user. Its key comes from /usr/share/wadspaces/ssh/admin and its
# password from wadspaces-admin-password.service (both baked in by build.sh).
u admin - "WadSpaces admin" /var/home/admin /bin/bash
m admin wheel
