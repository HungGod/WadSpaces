# The machine's terminal (foot, run by wadd as WadTerminal:
# /usr/lib/wadspaces/workspaces.d/terminal.toml), in WadSpaces' dark colours.
# A user's own ~/.config/foot/foot.ini wins over this one.
font=monospace:size=12
pad=12x12

[colors]
background=0a0614
foreground=ede9f6
selection-background=3a2d57
# black red green yellow blue magenta cyan white
regular0=140d22
regular1=ff3d81
regular2=c6ff1f
regular3=ffc857
regular4=7aa2ff
regular5=c792ea
regular6=5ee7df
regular7=d6d0e4
bright0=4b3f66
bright1=ff6fa3
bright2=d9ff6a
bright3=ffd98a
bright4=a4c0ff
bright5=dcb5f2
bright6=8ef0ea
bright7=ffffff
cursor=0a0614 c6ff1f
