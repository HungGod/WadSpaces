# Kale Phone: a lean image, its desktop a window on this screen.
# The image's copy: wadd applies it when it's new or changed (wad_store::vendor).
name = "Kale Phone"
image = "ghcr.io/hunggod/wadspaces-kale-p:latest"
display = "host"
hotkey = 6
icon = "/usr/share/wadspaces/icons/kale-p.png"
secrets = ["github_token"]
volumes = ["wad-kale-p-config:/config:z"]
devices = ["/dev/dri", "/dev/kvm"]
shm_size = "1g"

[env]
PUID = "1000"
PGID = "1000"
TZ = "Pacific/Fiji"
GIT_USER_NAME = "HungGod"
GIT_USER_EMAIL = "throwupcow@gmail.com"
