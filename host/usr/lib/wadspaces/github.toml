# The WadSpaces OAuth App on GitHub (Settings → Developer settings → OAuth
# Apps), client ID Ov23lia8qVymk05q5E4i. Firebase Auth runs its sign-in (the
# app's client ID and secret are in the Firebase console; its redirect URI is
# Firebase's /__/auth/handler); the WadSpaces Client asks it for these scopes.
# What the token may do: clone, pull and push repos (private ones too), push
# changes to .github/workflows, read the account's orgs for
# `gh repo list <org>`, push and pull packages (ghcr.io and the other
# registries), and read the account's email for Firebase.
scopes = ["repo", "workflow", "read:org", "write:packages", "user:email"]
