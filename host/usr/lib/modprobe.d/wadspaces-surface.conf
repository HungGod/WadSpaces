# Surface Book 2 (and the Surfaces like it): the embedded controller hub
# (surface_aggregator's serial hub) takes its interrupt from a GPIO, so the
# GPIO driver must be there first. Without it the hub fails to start ("failed
# to setup IRQ", -22), every ACPI call that goes through it times out, and
# because ACPI runs one call at a time, every driver behind it (graphics,
# sound, thermal, buttons) stalls for minutes: no i915 means no backlight and
# software rendering. idma64: the UART's DMA, so it doesn't fall back to PIO.
softdep surface_aggregator pre: pinctrl_sunrisepoint idma64
