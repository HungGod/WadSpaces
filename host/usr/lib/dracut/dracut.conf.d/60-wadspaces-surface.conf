# Drivers loaded in the initramfs, in the first seconds of boot, before
# anything else can hold them up (modprobe.d/wadspaces-surface.conf says why).
#   force_drivers  loaded in this order before udev starts (as rd.driver.pre=):
#                  the GPIO controller, then the Surface's controller hub
#   add_drivers    there for udev: the keyboard, the batteries (ACPI reads
#                  them through surface_acpi_notify), graphics (its firmware
#                  comes along: the backlight and GPU rendering) and the
#                  sound card and codecs
force_drivers+=" pinctrl_sunrisepoint idma64 surface_aggregator surface_aggregator_registry surface_aggregator_hub "
add_drivers+=" surface_hid_core surface_hid surface_kbd surface_acpi_notify surface_battery surface_charger i915 snd_hda_intel snd_hda_codec_alc269 snd_hda_codec_hdmi snd_hda_codec_generic "
install_items+=" /usr/lib/modprobe.d/wadspaces-surface.conf "

# Small: the root is XFS on the USB stick, unencrypted, so no network,
# remote, RAID/LVM, TPM/FIDO unlock or VM guest modules (the stock
# --no-hostonly image carries them all).
compress="zstd"
omit_dracutmodules+=" nfs nvmf iscsi lvm mdraid nvdimm qemu qemu-net virtiofs walinuxagent clevis clevis-pin-null clevis-pin-sss clevis-pin-tang clevis-pin-tpm2 fido2 pkcs11 network-manager network kernel-network-modules memstrack "
