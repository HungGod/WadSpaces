<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting…</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="splash">
    <div class="splash-card">
      <div class="art" id="art"></div>
      <h1 id="name">Starting…</h1>
      <div class="phase" id="phase">Preparing</div>
      <div class="bar" id="bar"><i></i></div>
      <div class="detail" id="detail"></div>
      <div class="error-box" id="error" hidden></div>
      <div class="row" id="actions" hidden>
        <button class="btn primary" id="retry">Try again</button>
        <button class="btn" id="back">Back to launcher</button>
      </div>
    </div>
  </main>
  <script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  const id = decodeURIComponent(location.pathname.split("/").pop());
  const LABELS = {
    idle: "Preparing", pulling: "Downloading the workspace", starting: "Starting the container",
    waiting: "Waiting for the desktop", ready: "Opening", stopping: "Stopping", error: "Something went wrong",
  };
  let readySince = 0;

  async function post(path) {
    const r = await fetch(path, { method: "POST" });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  }

  async function poll() {
    let ws;
    try {
      const r = await fetch(`/api/workspaces/${encodeURIComponent(id)}`, { cache: "no-store" });
      if (r.status === 404) { location.href = "/"; return; }
      ws = await r.json();
    } catch (_) {
      $("phase").textContent = "Waiting for wadd…";
      return setTimeout(poll, 1500);
    }
    document.title = ws.name;
    $("name").textContent = ws.name;
    if (ws.icon && !$("art").style.backgroundImage) $("art").style.backgroundImage = `url("${ws.icon}")`;
    const s = ws.state;
    $("phase").textContent = LABELS[s.phase] || s.phase;
    $("detail").textContent = s.message || "";
    $("bar").className = "bar" + (s.phase === "ready" ? " done" : s.phase === "error" ? " error" : "");
    const failed = s.phase === "error";
    $("error").hidden = !failed;
    $("error").textContent = failed ? s.error : "";
    $("actions").hidden = !failed;

    if (s.phase === "ready") {
      // wadd navigates the kiosk itself. If this page is still showing a few
      // seconds later there is no kiosk (dev mode), so go there directly.
      readySince = readySince || Date.now();
      if (Date.now() - readySince > 3000) { location.href = ws.url; return; }
    } else {
      readySince = 0;
    }
    setTimeout(poll, failed ? 3000 : 1000);
  }

  $("retry").addEventListener("click", () => post(`/api/workspaces/${encodeURIComponent(id)}/switch`).catch(() => {}));
  $("back").addEventListener("click", () => post("/api/launcher").catch(() => { location.href = "/"; }));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("back").click(); });
  poll();
  </script>
</body>
</html>
