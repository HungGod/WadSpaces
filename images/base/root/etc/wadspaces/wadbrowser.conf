# WadBrowser's settings for this workspace (a user's own go in
# ~/.config/wadbrowser/wadbrowser.conf). A WadSpaces Client design replaces this
# file: `default` follows the WadBrowser icon on its desktop.
#
# What links open in: full (tabs and an address bar) or focus (no address bar).
default = focus
# hibernate_after_minutes = 15   # idle tabs sleep to free memory; 0: never
# home = https://example.com      # new tabs and the home button
# search = https://duckduckgo.com/?q=%s
# gpu = auto                      # auto | on | off
