---
# IntelligenceQuest Dev workspace, run by hand on a Wayland desktop: it opens
# there as one window, as wadd runs it on a machine's screen.
#   images/build.sh --example iq-dev && podman-compose up -d
secrets:
  # printf '%s' '<fine-grained PAT>' | podman secret create github_token -
  github_token:
    external: true

volumes:
  # all of /config persists: VS Code extensions, Claude Code login (projects are host folders, mounted by wadd)
  wad-iq-dev-config:

services:
  iq-dev:
    image: localhost/wadspaces-iq-dev:latest
    container_name: wad-iq-dev
    labels:
      wadspaces.id: iq-dev
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Fiji
      - GIT_USER_NAME=HungGod
      - GIT_USER_EMAIL=throwupcow@gmail.com
      - WADSPACES_WAYLAND=${WAYLAND_DISPLAY:-wayland-0}
      - PULSE_SERVER=unix:/run/wadspaces-display/pulse/native
    secrets:
      - github_token
    volumes:
      # :z is required on SELinux hosts (see ../writing/README.md)
      - wad-iq-dev-config:/config:z
      # The desktop it draws on, and its sound: this session's runtime dir.
      - ${XDG_RUNTIME_DIR}:/run/wadspaces-display
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      # The runtime dir isn't relabelled: no SELinux separation.
      - label=disable
    shm_size: "1gb"
    # wadd owns the lifecycle
    restart: "no"
