[project]
name = "wadd"
version = "0.1.0"
description = "WadSpaces workspace switcher daemon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "websockets>=12",
    "pyyaml>=6",
]

[project.optional-dependencies]
hotkeys = ["evdev>=1.6"]
test = ["pytest>=8"]

[project.scripts]
wadd = "wadd.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wadd*"]

[tool.setuptools.package-data]
wadd = ["web/*"]
