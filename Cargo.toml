[workspace]
resolver = "3"
members = ["crates/*", "apps/wadcreator/src-tauri", "apps/wadd", "apps/hud", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
wad-proto = { path = "crates/wad-proto" }
wad-github = { path = "crates/wad-github" }
wad-firebase = { path = "crates/wad-firebase" }
wad-core = { path = "crates/wad-core" }
wad-config = { path = "crates/wad-config" }
wad-store = { path = "crates/wad-store" }
wad-podman = { path = "crates/wad-podman" }
wad-systemd = { path = "crates/wad-systemd" }
wad-sway = { path = "crates/wad-sway" }
wad-input = { path = "crates/wad-input" }
wad-git = { path = "crates/wad-git" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
thiserror = "2"
toml = "1"
serde_norway = "0.9"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal", "io-util", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Release candidates: pinned exactly, they break between rcs.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.6"

wiremock = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["user", "fs", "ioctl", "poll", "hostname"] }
evdev = "0.13"
libc = "0.2"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tempfile = "3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
async-trait = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# The UI's WebAssembly (cargo xtask wasm): small over fast.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
