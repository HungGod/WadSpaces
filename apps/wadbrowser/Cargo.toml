[package]
name = "wadbrowser"
description = "WadBrowser: the WadSpaces web browser (Tauri chrome, WebKitGTK tabs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
gtk.workspace = true
webkit2gtk.workspace = true
# What WebKit hands back from scripts (the version webkit2gtk uses).
javascriptcore-rs = "=1.1.2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
# Favicons to PNG (gtk re-exports cairo; this turns on its PNG writer).
cairo-rs = { version = "0.18", features = ["png"] }
# The spike's virtual pointer (sway has no input devices headless).
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["custom-protocol"]
# The chrome is static files in ui/, embedded in the binary: there is no dev server.
custom-protocol = ["tauri/custom-protocol"]
# A scripted run that checks the window layout, app ids and moving tabs between
# windows (spike/run.sh). Never in the image.
spike = ["dep:wayland-client", "dep:wayland-protocols-wlr"]
