[package]
name = "wadspaces-hud"
description = "What floats above every window on a WadSpaces machine: Home, Wi-Fi, power, the clock, brightness and volume, the focus timer, the switcher, the clipboard history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "wadspaces-hud"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde.workspace = true
serde_json.workspace = true
wad-clip = { path = "../../crates/wad-clip" }

[dev-dependencies]
# The client's tests talk to the Rust wadd itself, in-process.
wadd = { path = "../wadd" }
wad-config.workspace = true
wad-proto.workspace = true
tempfile.workspace = true
tokio.workspace = true
