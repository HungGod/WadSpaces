[package]
name = "wadspaces-hud"
description = "What floats above every window on a WadSpaces machine: Home, Wi-Fi, power, the focus timer, the switcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "wadspaces-hud"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
async-channel = "2"
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", default-features = false, features = ["json"] }
