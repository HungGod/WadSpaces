[package]
name = "wadspaces-desktop"
description = "WadSpaces Client, native: the machine's shell in GTK4 (the kiosk app, in place of the Tauri one once it does all it does)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
gdk-wayland = { package = "gdk4-wayland", version = "0.11" }
wad-gtk = { path = "../../crates/wad-gtk" }
wad-wadd-client = { path = "../../crates/wad-wadd-client" }
wad-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-channel = "2"
tracing.workspace = true
tracing-subscriber.workspace = true
