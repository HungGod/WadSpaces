[package]
name = "wadcreator"
description = "Wad Creator: the WadSpaces app on a machine (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
wad-proto.workspace = true
wad-github.workspace = true
wad-firebase.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tauri-plugin-single-instance.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Only for `--features spike` (below).
webkit2gtk = { version = "=2.0.2", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }

[features]
# Serve the built UI (dist-machine) from inside the binary instead of Vite's
# dev server. `tauri build` turns it on; the host image build passes it.
custom-protocol = ["tauri/custom-protocol"]
# A scripted run that checks WebKitGTK and Firebase behave (stage 1a, S3) and
# saves screenshots: WADCREATOR_SPIKE_DIR=<dir> wadcreator. Never in the image.
spike = ["dep:webkit2gtk", "dep:cairo-rs"]
