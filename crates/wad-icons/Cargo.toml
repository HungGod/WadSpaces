[package]
name = "wad-icons"
description = "Web apps' icons, made before the image builds: the site's favicon as a silhouette card (or a text card), cached"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "wadspaces-icon"
path = "src/bin/wadspaces-icon.rs"
required-features = ["cli"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "webp", "gif", "bmp"] }
resvg = { version = "0.48", default-features = false }
ttf-parser = "0.25"
url = "2"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
tracing.workspace = true
reqwest = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
clap = { workspace = true, optional = true }

[features]
# Fetching sites' icons (wadd, and the CLI's `fetch`).
fetch = ["dep:reqwest", "dep:futures-util", "dep:tokio"]
# The wadspaces-icon program, for images built without wadd.
cli = ["fetch", "dep:clap"]

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
